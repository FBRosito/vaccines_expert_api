services:
  # --- Serviço da API (Aplicação Flask) ---
  api:
    build: .
    ports:
      - "8000:5000"
    volumes:
      - .:/app
    env_file:
      - .env
    depends_on:
      - vacinapi_dev_db

  # --- Banco de Dados PostgreSQL ---
  vacinapi_dev_db:
    image: postgres:14-alpine
    volumes:
      - postgres_data:/var/lib/postgresql/data/
    environment:
      - POSTGRES_USER=${POSTGRES_USER}
      - POSTGRES_PASSWORD=${POSTGRES_PASSWORD}
      - POSTGRES_DB=${POSTGRES_DB}
    ports:
      - "5433:5432"

  # --- HTTPS Caddy ---
  caddy:
    image: caddy:latest
    restart: unless-stopped
    ports:
      - "8080:80"
      - "8443:443"
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile
      - caddy_data:/data
      - caddy_config:/config
    depends_on:
      - api

volumes:
  postgres_data:
  caddy_data:
  caddy_config: